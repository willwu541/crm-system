openapi: 3.0.3
info:
  title: 外贸 CRM 管理者 AI 接口
  version: "1.0.0"
  description: |
    管理者本人使用。请求头 Authorization: Bearer <EXPORT_AI_API_KEY>。
    未配置 EXPORT_AI_API_KEY 时接口关闭（503），空密钥不会放行。
    可以查客户、线索、项目。可以新建和修改线索、项目、客户、联系人，可以标记进度、追加跟进、写备注、写下次跟进、暂缓、写客户分析、分配线索和项目，也可以把未分配的线索和项目认领到管理者自己名下。
    新建线索进入公海，负责人留空。新建客户的负责人是管理者本人。新建项目不分配，之后再用分配或认领。
    不能发信，不能改登录和用户密钥，不能改金额，不能删除，不能废弃，不能看国内 CRM。
    作者固定为密钥对应的管理者。新建和修改不能传 ownerId 冒充业务员。分配接口里的 userId / ownerId 只表示被分配人。
    分配对象与页面相同：在职业务员、经理，以及被设为业务经理的人。已有负责人可以改派。已转化线索不能再分配。
servers:
  - url: https://你的域名
    description: 换成 CRM 实际访问地址，不要带末尾斜杠
paths:
  /api/export/ai/customers:
    get:
      operationId: listCustomers
      summary: 查客户
      description: 按关键词、国家、阶段（status 或 stage）筛选。客户在系统里必有负责人，unassigned=true 时结果为空。不返回密码。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/keyword"
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/stage"
        - $ref: "#/components/parameters/unassigned"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: 精简客户列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/NotConfigured"
    post:
      operationId: createCustomer
      summary: 新建客户
      description: 公司名称必填。负责人写成管理者本人，请求体不能传 ownerId。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerWriteBody"
      responses:
        "200":
          description: 已新建
  /api/export/ai/customers/{id}:
    get:
      operationId: getCustomer
      summary: 客户详情和最近沟通
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: 客户、联系人和最近 15 条活动
        "404":
          description: 不存在
    patch:
      operationId: updateCustomer
      summary: 修改客户
      description: 可改公司资料、备注、下次跟进、状态。不改负责人，不改 aiAnalysis（分析走 analysis）。不能改金额。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerWriteBody"
      responses:
        "200":
          description: 已修改
  /api/export/ai/customers/{id}/contacts:
    post:
      operationId: createCustomerContact
      summary: 给客户新建联系人
      description: 不能传 ownerId。联系人邮箱只是资料，不会发信。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactWriteBody"
      responses:
        "200":
          description: 已新建
  /api/export/ai/contacts/{id}:
    patch:
      operationId: updateContact
      summary: 修改联系人
      description: 可改姓名、职务、电话、邮箱、备注、是否主联系人。不会发信，不能删除。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactWriteBody"
      responses:
        "200":
          description: 已修改
  /api/export/ai/leads:
    get:
      operationId: listLeads
      summary: 查线索
      description: 关键词、国家、阶段（线索 status）、unassigned=true 表示负责人 ownerId 为空（公海）。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/keyword"
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/stage"
        - $ref: "#/components/parameters/unassigned"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: 精简线索列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordList"
    post:
      operationId: createLead
      summary: 新建线索
      description: 公司名称必填。与页面相同，新建后在公海，负责人留空。不能传 ownerId。status 不能用来转化或废弃。可写备注和下次跟进。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadWriteBody"
      responses:
        "200":
          description: 已新建
  /api/export/ai/leads/{id}:
    get:
      operationId: getLead
      summary: 线索详情和最近沟通
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: 线索和最近活动
    patch:
      operationId: updateLead
      summary: 修改线索
      description: 可改公司资料、备注、下次跟进。status 传 parked 为暂缓，resumeParked 为 true 时取消暂缓。不能传 ownerId，不能废弃，不能转化。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadWriteBody"
      responses:
        "200":
          description: 已修改
  /api/export/ai/projects:
    get:
      operationId: listProjects
      summary: 查项目
      description: 关键词、国家、阶段 stage、进度标记 progressMark、unassigned=true 表示未分配，另可按生命周期、负责人、资料更新、下次跟进、金额区间筛。projectValueWan 为资料里的金额原文（万元口径），projectValueWanNumber 为解析后的人民币万元数值。日期按东八区。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/keyword"
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/stage"
        - name: progressMark
          in: query
          description: 进度标记。待联系、已联系、有意向、无需求、跟进中、已结束
          schema:
            type: string
        - $ref: "#/components/parameters/unassigned"
        - name: lifecycle
          in: query
          description: active 跟进中（排除废弃和暂缓开发）、parked 暂缓开发、abandoned 废弃。不传则不限。
          schema:
            type: string
            enum: [active, parked, abandoned]
        - name: ownerId
          in: query
          description: 负责人用户 id。和 unassigned=true 同传时以 unassigned 为准。
          schema:
            type: string
        - name: sourceUpdated
          in: query
          description: 资料更新。1 曾经更新过；today 今天；week 本周（周一起）。
          schema:
            type: string
            enum: ["1", today, week]
        - name: followUpDue
          in: query
          description: 下次跟进日期。overdue 已过期（今天之前）；today 今天；week 今天起 7 天内。
          schema:
            type: string
            enum: [overdue, today, week]
        - name: valueMin
          in: query
          description: 项目金额下限，人民币万元，按 projectValueWanNumber 比较。金额解析不出的项目不会出现。
          schema:
            type: number
        - name: valueMax
          in: query
          description: 项目金额上限，人民币万元。
          schema:
            type: number
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: 精简项目列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordList"
    post:
      operationId: createProject
      summary: 新建项目
      description: 项目名称必填。新建后不分配，负责人留空。之后用分配或认领。不能传金额字段，不能传 ownerId，不能标废弃。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWriteBody"
      responses:
        "200":
          description: 已新建
  /api/export/ai/projects/{id}:
    get:
      operationId: getProject
      summary: 项目详情和项目上的动作记录
      description: activities 是项目自己的动作记录（认领、分配、进度标记、阶段、跟进状态、资料更新、跟进正文、下次跟进日期），新的在前，最多 30 条；每条有 kind、中文 label、content、createdAt、userName。nextFollowUpAt 为下次跟进日期（东八区当天零点），feedbackDueAt 为派单时希望业务员反馈的日期。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: 项目、相关公司和项目动作记录
    patch:
      operationId: updateProject
      summary: 修改项目
      description: 可改项目资料、备注、下次跟进、进度标记。status 传 parked 为暂缓，resumeParked 为 true 时取消暂缓。不能改金额，不能传 ownerId，不能废弃。分配仍走 assign，认领仍走 claim，且只能由管理者操作到自己或按页面规则改派。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWriteBody"
      responses:
        "200":
          description: 已修改
  /api/export/ai/leads/{id}/progress-mark:
    post:
      operationId: markLead
      summary: 标记线索联系进度
      description: 进度标记只接受待联系、已联系、有意向、无需求、跟进中、已结束。写入线索活动，作者是管理者。相同标记不重复记。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressMarkBody"
      responses:
        "200":
          description: 已标记
  /api/export/ai/projects/{id}/progress-mark:
    post:
      operationId: markProject
      summary: 标记项目联系进度
      description: 与线索使用同一组进度标记。写入项目活动，每日总结里操作者是管理者。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressMarkBody"
      responses:
        "200":
          description: 已标记
  /api/export/ai/leads/{id}/follow-ups:
    post:
      operationId: followLead
      summary: 给线索追加跟进
      description: 只追加一条跟进，不覆盖历史，不改负责人。content 为正文，时间由服务器写入。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpBody"
      responses:
        "200":
          description: 已追加
  /api/export/ai/projects/{id}/follow-ups:
    post:
      operationId: followProject
      summary: 给项目追加跟进
      description: 只追加一条项目跟进，不覆盖历史，不改金额和负责人。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpBody"
      responses:
        "200":
          description: 已追加
  /api/export/ai/customers/{id}/analysis:
    post:
      operationId: writeCustomerAnalysis
      summary: 追加客户分析
      description: 写入客户的 aiAnalysis，每段带时间。不改业务员写的 notes。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisBody"
      responses:
        "200":
          description: 已追加
  /api/export/ai/leads/{id}/claim:
    post:
      operationId: claimLead
      summary: 管理者认领线索
      description: 只认领还没有负责人的公海线索，负责人写成密钥对应的管理者。不占业务员每日额度。已有负责人时返回 409，不能抢走。请求体可为空。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: 已认领到管理者名下
        "409":
          description: 已经有负责人
  /api/export/ai/projects/{id}/claim:
    post:
      operationId: claimProject
      summary: 管理者认领项目
      description: 与页面上管理者认领项目相同。只认领 owner 为空的项目，不能抢走已有负责人。请求体可为空。每日总结记为管理者认领。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: 已认领到管理者名下
        "409":
          description: 已经有负责人
  /api/export/ai/leads/{id}/assign:
    post:
      operationId: assignLead
      summary: 分配线索
      description: 与页面分配线索相同。请求体 userId 为被分配人。已有负责人可以改派。已转化线索不能分配。分配记录的操作者是管理者。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadAssignBody"
      responses:
        "200":
          description: 已分配
        "400":
          description: 对象不在可分配名单，或线索已转化
  /api/export/ai/projects/{id}/assign:
    post:
      operationId: assignProject
      summary: 分配项目
      description: 与页面分配项目相同。请求体 ownerId 为被分配人。已有负责人可以改派。写入项目活动，每日总结里操作者是管理者。不能把负责人清掉。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectAssignBody"
      responses:
        "200":
          description: 已分配
        "400":
          description: 对象不在可分配名单
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 服务器环境变量 EXPORT_AI_API_KEY 的值。不要把密钥写进仓库。
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    keyword:
      name: keyword
      in: query
      description: 公司、联系人、邮箱、电话或项目名等关键词
      schema:
        type: string
    country:
      name: country
      in: query
      description: 国家
      schema:
        type: string
    stage:
      name: stage
      in: query
      description: 客户/线索传状态；项目传阶段代码，如 tendering、construction
      schema:
        type: string
    unassigned:
      name: unassigned
      in: query
      description: true 或 1 表示负责人 ownerId 为空
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: 条数，默认 20，最多 50
      schema:
        type: integer
  responses:
    Unauthorized:
      description: 未带密钥或密钥错误
    NotConfigured:
      description: 服务器未配置 EXPORT_AI_API_KEY
  schemas:
    RecordList:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              companyName:
                type: string
                description: 公司；项目列表里优先取相关公司，否则用项目名
              projectName:
                type: string
              contactName:
                type: string
                nullable: true
              email:
                type: string
                nullable: true
              phone:
                type: string
                nullable: true
              country:
                type: string
                nullable: true
              ownerId:
                type: string
                nullable: true
              ownerName:
                type: string
                nullable: true
                description: 负责人姓名
              lastAction:
                type: string
                nullable: true
                description: 最近动作或结果摘要
              projectValueWan:
                type: string
                nullable: true
                description: 项目金额（万元原文）。客户和线索为空
              projectValueWanNumber:
                type: number
                nullable: true
                description: 项目金额，人民币万元数值。仅项目列表有
              nextFollowUpAt:
                type: string
                format: date-time
                nullable: true
                description: 下次跟进日期。仅项目列表有
              sourceUpdatedAt:
                type: string
                format: date-time
                nullable: true
                description: 资料最近更新时间。仅项目列表有
              progressMark:
                type: string
                nullable: true
                description: 项目进度标记
              stage:
                type: string
              status:
                type: string
                nullable: true
                description: 项目为跟进状态代码，如 hunting、parked、abandoned
    ProgressMarkBody:
      type: object
      required: [progressMark]
      properties:
        progressMark:
          type: string
          enum: ["待联系", "已联系", "有意向", "无需求", "跟进中", "已结束"]
    FollowUpBody:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: 跟进正文，1 到 4000 字。不要传 ownerId。
    AnalysisBody:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: 客户分析正文。追加到 aiAnalysis，不改 notes。
    LeadAssignBody:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          description: 被分配人的用户 id。在职业务员、经理，或被设为业务经理的人。
    LeadWriteBody:
      type: object
      properties:
        companyName:
          type: string
        notes:
          type: string
          nullable: true
        nextFollowUpAt:
          type: string
          nullable: true
          description: YYYY-MM-DD 或 ISO，按东八区当天零点保存。
        status:
          type: string
          description: 线索状态。parked 表示暂缓开发。不接受 converted。
        resumeParked:
          type: boolean
          description: true 时取消暂缓。
    ProjectWriteBody:
      type: object
      properties:
        name:
          type: string
        notes:
          type: string
          nullable: true
        nextFollowUpAt:
          type: string
          nullable: true
        progressMark:
          type: string
        status:
          type: string
          description: 跟进状态。parked 表示暂缓。不接受 abandoned。
        resumeParked:
          type: boolean
    CustomerWriteBody:
      type: object
      properties:
        companyName:
          type: string
        notes:
          type: string
          nullable: true
        nextFollowUpAt:
          type: string
          nullable: true
        status:
          type: string
    ContactWriteBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        isPrimary:
          type: boolean
    ProjectAssignBody:
      type: object
      required: [ownerId]
      properties:
        ownerId:
          type: string
          description: 被分配人的用户 id。和线索分配同一名单。这里的 ownerId 是新负责人，不是冒充作者。
