openapi: 3.0.3
info:
  title: 外贸 CRM 管理者 AI 接口
  version: "1.0.0"
  description: |
    管理者本人使用。请求头 Authorization: Bearer <EXPORT_AI_API_KEY>。
    未配置 EXPORT_AI_API_KEY 时接口关闭（503），空密钥不会放行。
    可以查客户、线索、项目。可以标记联系、追加跟进、写客户分析、分配线索和项目，也可以把未分配的线索和项目认领到管理者自己名下。
    不能发信，不能改登录，不能改金额，不能删数据，不能看国内 CRM。
    作者固定为密钥对应的管理者，请求体不能借 ownerId 冒充业务员。
    分配对象与页面相同：在职业务员、经理，以及被设为业务经理的人。已有负责人可以改派。已转化线索不能再分配。
servers:
  - url: https://你的域名
    description: 换成 CRM 实际访问地址，不要带末尾斜杠
paths:
  /api/export/ai/customers:
    get:
      operationId: listCustomers
      summary: 查客户
      description: 按关键词、国家、阶段（status 或 stage）筛选。客户在系统里必有负责人，unassigned=true 时结果为空。不返回密码。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/keyword"
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/stage"
        - $ref: "#/components/parameters/unassigned"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: 精简客户列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/export/ai/customers/{id}:
    get:
      operationId: getCustomer
      summary: 客户详情和最近沟通
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: 客户、联系人和最近 15 条活动
        "404":
          description: 不存在
  /api/export/ai/leads:
    get:
      operationId: listLeads
      summary: 查线索
      description: 关键词、国家、阶段（线索 status）、unassigned=true 表示负责人 ownerId 为空（公海）。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/keyword"
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/stage"
        - $ref: "#/components/parameters/unassigned"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: 精简线索列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordList"
  /api/export/ai/leads/{id}:
    get:
      operationId: getLead
      summary: 线索详情和最近沟通
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: 线索和最近活动
  /api/export/ai/projects:
    get:
      operationId: listProjects
      summary: 查项目
      description: 关键词、国家、阶段 stage、进度标记 progressMark、unassigned=true 表示未分配。projectValueWan 为资料里的金额原文（万元口径）。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/keyword"
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/stage"
        - name: progressMark
          in: query
          description: 进度标记。待联系、已联系、有意向、无需求、跟进中、已结束
          schema:
            type: string
        - $ref: "#/components/parameters/unassigned"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: 精简项目列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordList"
  /api/export/ai/projects/{id}:
    get:
      operationId: getProject
      summary: 项目详情和关联线索的最近沟通
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: 项目、相关公司和最近活动
  /api/export/ai/leads/{id}/progress-mark:
    post:
      operationId: markLead
      summary: 标记线索联系进度
      description: 进度标记只接受待联系、已联系、有意向、无需求、跟进中、已结束。写入线索活动，作者是管理者。相同标记不重复记。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressMarkBody"
      responses:
        "200":
          description: 已标记
  /api/export/ai/projects/{id}/progress-mark:
    post:
      operationId: markProject
      summary: 标记项目联系进度
      description: 与线索使用同一组进度标记。写入项目活动，每日总结里操作者是管理者。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressMarkBody"
      responses:
        "200":
          description: 已标记
  /api/export/ai/leads/{id}/follow-ups:
    post:
      operationId: followLead
      summary: 给线索追加跟进
      description: 只追加一条跟进，不覆盖历史，不改负责人。content 为正文，时间由服务器写入。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpBody"
      responses:
        "200":
          description: 已追加
  /api/export/ai/projects/{id}/follow-ups:
    post:
      operationId: followProject
      summary: 给项目追加跟进
      description: 只追加一条项目跟进，不覆盖历史，不改金额和负责人。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpBody"
      responses:
        "200":
          description: 已追加
  /api/export/ai/customers/{id}/analysis:
    post:
      operationId: writeCustomerAnalysis
      summary: 追加客户分析
      description: 写入客户的 aiAnalysis，每段带时间。不改业务员写的 notes。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisBody"
      responses:
        "200":
          description: 已追加
  /api/export/ai/leads/{id}/claim:
    post:
      operationId: claimLead
      summary: 管理者认领线索
      description: 只认领还没有负责人的公海线索，负责人写成密钥对应的管理者。不占业务员每日额度。已有负责人时返回 409，不能抢走。请求体可为空。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: 已认领到管理者名下
        "409":
          description: 已经有负责人
  /api/export/ai/projects/{id}/claim:
    post:
      operationId: claimProject
      summary: 管理者认领项目
      description: 与页面上管理者认领项目相同。只认领 owner 为空的项目，不能抢走已有负责人。请求体可为空。每日总结记为管理者认领。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: 已认领到管理者名下
        "409":
          description: 已经有负责人
  /api/export/ai/leads/{id}/assign:
    post:
      operationId: assignLead
      summary: 分配线索
      description: 与页面分配线索相同。请求体 userId 为被分配人。已有负责人可以改派。已转化线索不能分配。分配记录的操作者是管理者。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadAssignBody"
      responses:
        "200":
          description: 已分配
        "400":
          description: 对象不在可分配名单，或线索已转化
  /api/export/ai/projects/{id}/assign:
    post:
      operationId: assignProject
      summary: 分配项目
      description: 与页面分配项目相同。请求体 ownerId 为被分配人。已有负责人可以改派。写入项目活动，每日总结里操作者是管理者。不能把负责人清掉。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectAssignBody"
      responses:
        "200":
          description: 已分配
        "400":
          description: 对象不在可分配名单
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 服务器环境变量 EXPORT_AI_API_KEY 的值。不要把密钥写进仓库。
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    keyword:
      name: keyword
      in: query
      description: 公司、联系人、邮箱、电话或项目名等关键词
      schema:
        type: string
    country:
      name: country
      in: query
      description: 国家
      schema:
        type: string
    stage:
      name: stage
      in: query
      description: 客户/线索传状态；项目传阶段代码，如 tendering、construction
      schema:
        type: string
    unassigned:
      name: unassigned
      in: query
      description: true 或 1 表示负责人 ownerId 为空
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: 条数，默认 20，最多 50
      schema:
        type: integer
  responses:
    Unauthorized:
      description: 未带密钥或密钥错误
    NotConfigured:
      description: 服务器未配置 EXPORT_AI_API_KEY
  schemas:
    RecordList:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              companyName:
                type: string
                description: 公司；项目列表里优先取相关公司，否则用项目名
              projectName:
                type: string
              contactName:
                type: string
                nullable: true
              email:
                type: string
                nullable: true
              phone:
                type: string
                nullable: true
              country:
                type: string
                nullable: true
              ownerId:
                type: string
                nullable: true
              ownerName:
                type: string
                nullable: true
                description: 负责人姓名
              lastAction:
                type: string
                nullable: true
                description: 最近动作或结果摘要
              projectValueWan:
                type: string
                nullable: true
                description: 项目金额（万元原文）。客户和线索为空
              progressMark:
                type: string
                nullable: true
                description: 项目进度标记
              stage:
                type: string
              status:
                type: string
                nullable: true
    ProgressMarkBody:
      type: object
      required: [progressMark]
      properties:
        progressMark:
          type: string
          enum: ["待联系", "已联系", "有意向", "无需求", "跟进中", "已结束"]
    FollowUpBody:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: 跟进正文，1 到 4000 字。不要传 ownerId。
    AnalysisBody:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: 客户分析正文。追加到 aiAnalysis，不改 notes。
    LeadAssignBody:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          description: 被分配人的用户 id。在职业务员、经理，或被设为业务经理的人。
    ProjectAssignBody:
      type: object
      required: [ownerId]
      properties:
        ownerId:
          type: string
          description: 被分配人的用户 id。和线索分配同一名单。这里的 ownerId 是新负责人，不是冒充作者。
