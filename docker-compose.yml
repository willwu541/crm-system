version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: CHANGE_THIS_PASSWORD
      POSTGRES_DB: crm_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://crm_user:CHANGE_THIS_PASSWORD@postgres:5432/crm_db?schema=public
      - SESSION_SECRET=CHANGE_THIS_TO_RANDOM_64_CHARS
      - WEBSITE_CHAT_API_URL=${WEBSITE_CHAT_API_URL:-https://wibergmetal.com/api/chat.php}
      - WEBSITE_CHAT_API_KEY=${WEBSITE_CHAT_API_KEY}

volumes:
  pgdata:
